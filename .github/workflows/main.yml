name: Build Kernel for haydn (Redmi K40 Pro+)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "lineae-23.2" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ARCH: arm64
      SUBARCH: arm64
      CC: clang
      CLANG_TRIPLE: aarch64-linux-gnu-
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
      OUT_DIR: out
      DEVICE: haydn
      KERNEL_NAME: haydn-Kernel

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex \
          libssl-dev libelf-dev libncurses-dev zip unzip \
          curl wget git python3 python-is-python3 \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Setup Clang toolchain
      run: |
        mkdir -p $HOME/toolchains
        git clone --depth=1 https://github.com/kdrag0n/proton-clang \
          $HOME/toolchains/proton-clang
        echo "$HOME/toolchains/proton-clang/bin" >> $GITHUB_PATH

    - name: Build defconfig
      run: |
        make O=$OUT_DIR ARCH=$ARCH CC=$CC \
          CLANG_TRIPLE=$CLANG_TRIPLE \
          CROSS_COMPILE=$CROSS_COMPILE \
          CROSS_COMPILE_COMPAT=$CROSS_COMPILE_COMPAT \
          vendor/lahaina-qgki_defconfig \
          vendor/xiaomi_QGKI.config \
          vendor/haydn_QGKI.config

    - name: Build kernel
      run: |
        make O=$OUT_DIR ARCH=$ARCH CC=$CC \
          CLANG_TRIPLE=$CLANG_TRIPLE \
          CROSS_COMPILE=$CROSS_COMPILE \
          CROSS_COMPILE_COMPAT=$CROSS_COMPILE_COMPAT \
          LLVM=1 LLVM_IAS=1 \
          -j$(nproc)

    - name: Collect kernel outputs
      run: |
        mkdir -p $HOME/ak3
        cp $OUT_DIR/arch/arm64/boot/Image $HOME/ak3/
        [ -f $OUT_DIR/arch/arm64/boot/dtb ] && \
          cp $OUT_DIR/arch/arm64/boot/dtb $HOME/ak3/
        [ -f $OUT_DIR/arch/arm64/boot/dtbo.img ] && \
          cp $OUT_DIR/arch/arm64/boot/dtbo.img $HOME/ak3/
        ls -lh $HOME/ak3/

    - name: Package with AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 $HOME/ak3/anykernel3
        mv $HOME/ak3/Image $HOME/ak3/dtb $HOME/ak3/dtbo.img $HOME/ak3/anykernel3/ 2>/dev/null || true
        # 修改 anykernel.sh 中的设备名与分区
        sed -i 's/do.device.check=1/do.device.check=0/g' $HOME/ak3/anykernel3/anykernel.sh
        sed -i 's/^block=.*auto\/device/auto/' $HOME/ak3/anykernel3/anykernel.sh
        cd $HOME/ak3/anykernel3
        rm -rf .git .github
        zip -r9 ${KERNEL_NAME}-$(date +%Y%m%d)-A16-LOS23.2.zip * -x .gitignore README.md
        cp *.zip $GITHUB_WORKSPACE/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: haydn-kernel-LineageOS-23.2
        path: ${{ github.workspace }}/*.zip
